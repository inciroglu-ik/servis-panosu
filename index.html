<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İnciroğlu Otomotiv · Servis Danışmanı Performans Panosu</title>
<meta name="description" content="Servis danışmanı hedef tebliğ, aylık performans karnesi ve geri bildirim süreci yönetimi.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16324e">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --brand:#16324e; --brand-2:#1f456b; --accent:#c9a227; --accent-2:#e0be4f;
  --page:#eef1f4; --surface:#ffffff; --surface-2:#f7f8fa;
  --ink:#0e1b28; --ink-2:#52514e; --muted:#8a8f96; --grid:#e6e8ec; --line:#cfd4da;
  --ok:#0ca30c; --warn:#e8930c; --bad:#d03b3b; --info:#2a78d6;
  --radius:12px; --shadow:0 1px 3px rgba(16,27,40,.08),0 8px 24px rgba(16,27,40,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.hidden{display:none !important}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ---------- GİRİŞ ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,#0f2438 0%,#16324e 45%,#1f456b 100%)}
.login-card{width:100%;max-width:420px;background:var(--surface);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.login-top{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
  padding:26px 28px 22px;color:#fff;position:relative}
.login-top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-2) 50%,var(--accent) 100%)}
.login-top img{height:38px;margin-bottom:14px;filter:brightness(0) invert(1);opacity:.95}
.login-top h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:.01em}
.login-top p{margin:0;font-size:12.5px;opacity:.75;letter-spacing:.02em}
.login-body{padding:26px 28px 28px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
.fld input:focus{outline:none;border-color:var(--brand-2);background:#fff;
  box-shadow:0 0 0 3px rgba(31,69,107,.12)}
.btn-primary{width:100%;padding:12px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:.03em;transition:transform .12s,box-shadow .15s}
.btn-primary:hover{box-shadow:0 6px 18px rgba(22,50,78,.3)}
.btn-primary:active{transform:translateY(1px)}
.login-err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:17px;text-align:center}
.login-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--grid);
  font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6}

/* ---------- KABUK ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;
  padding:0 20px;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(16,27,40,.18)}
.topbar-in{display:flex;align-items:center;gap:16px;height:58px;max-width:1560px;margin:0 auto}
.topbar img{height:26px;filter:brightness(0) invert(1);opacity:.95}
.tb-title{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.tb-sub{font-size:11.5px;opacity:.7;letter-spacing:.03em;margin-left:-8px}
.tb-spacer{flex:1}
.tb-who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.tb-who b{font-size:13px;font-weight:600}
.tb-who span{font-size:10.5px;opacity:.72;letter-spacing:.07em;text-transform:uppercase}
.tb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;
  padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:background .15s}
.tb-btn:hover{background:rgba(255,255,255,.22)}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;
  position:sticky;top:58px;z-index:39;overflow-x:auto;scrollbar-width:thin}
.tabs-in{display:flex;gap:2px;max-width:1560px;margin:0 auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 17px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--brand)}
.tab.on{color:var(--brand);border-bottom-color:var(--accent);font-weight:600}
main{flex:1;padding:22px 20px 60px}
.wrap{max-width:1560px;margin:0 auto}
.view{opacity:1;transition:opacity .12s}
.view.fading{opacity:0}

/* ---------- KARTLAR ---------- */
.card{background:var(--surface);border:1px solid var(--grid);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.card-h{padding:15px 18px;border-bottom:1px solid var(--grid);display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#fff 0%,var(--surface-2) 100%)}
.card-h h3{font-family:var(--serif);font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-b{padding:18px}
.card-b.tight{padding:0}

/* ---------- ADIM ÇUBUĞU ---------- */
.steps{display:flex;gap:0;margin-bottom:20px;background:var(--surface);border:1px solid var(--grid);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.step{flex:1;padding:13px 16px;display:flex;align-items:center;gap:11px;position:relative;
  border-right:1px solid var(--grid)}
.step:last-child{border-right:0}
.step-n{width:27px;height:27px;border-radius:50%;background:var(--grid);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:0 0 auto}
.step.on .step-n{background:var(--brand);color:#fff}
.step.done .step-n{background:var(--ok);color:#fff}
.step-t{line-height:1.25}
.step-t b{display:block;font-size:12.5px;font-weight:600}
.step-t span{font-size:11px;color:var(--muted)}
.step.on{background:linear-gradient(180deg,rgba(201,162,39,.07) 0%,transparent 100%)}
.step.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}

/* ---------- FORM ELEMANLARI ---------- */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.f select,.f input{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
  min-width:150px;transition:border-color .15s,box-shadow .15s}
.f select:focus,.f input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(31,69,107,.1)}
.btn{padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--ink);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-2);color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-color:transparent;font-weight:600}
.btn.dark:hover{color:#fff;box-shadow:0 5px 16px rgba(22,50,78,.28)}
.btn.gold{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#3d2f00;border-color:transparent;font-weight:600}
.btn.gold:hover{color:#3d2f00;box-shadow:0 5px 16px rgba(201,162,39,.35)}
.btn.danger{color:var(--bad);border-color:#e8b4b4}
.btn.danger:hover{background:#fdf3f3;border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;border:1px solid var(--line);
  background:#fff;cursor:pointer;transition:all .15s}
.btn-sm:hover{border-color:var(--brand-2);color:var(--brand)}

/* ---------- TABLO ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11px;
  font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;
  border-bottom:2px solid var(--grid);white-space:nowrap;position:sticky;top:0;z-index:2}
table.tbl td{padding:8px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.grp-row td{background:linear-gradient(90deg,rgba(22,50,78,.06) 0%,transparent 100%);
  font-weight:700;font-size:11.5px;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;
  padding:9px 12px !important}
.mtr-in{width:100%;max-width:130px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
  text-align:right;font-variant-numeric:tabular-nums;background:#fffdf5}
.mtr-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,162,39,.15);background:#fff}
.mtr-in.ro{background:var(--surface-2);color:var(--ink-2)}
.mtr-sel{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px}
.mtr-ad{font-weight:500}
.mtr-not{display:block;font-size:11px;color:var(--muted);font-style:italic;margin-top:2px;line-height:1.35}
.mtr-hedef-info{font-size:10.5px;color:var(--muted);white-space:nowrap}

/* ---------- ROZETLER ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;
  letter-spacing:.02em;white-space:nowrap}
.b-ok{background:#e6f7e6;color:#0a7a0a}
.b-bad{background:#fdeaea;color:#b52d2d}
.b-warn{background:#fdf3e0;color:#a86a00}
.b-info{background:#e8f1fc;color:#1f5da8}
.b-mut{background:#eef0f3;color:#6b7078}
.b-gold{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3d2f00}

/* ---------- DURUM/BOŞ ---------- */
.empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:6px;font-family:var(--serif)}
.note{background:#f0f6fd;border-left:3px solid var(--info);padding:11px 14px;border-radius:0 8px 8px 0;
  font-size:12.5px;color:#1a3a5c;margin-bottom:14px;line-height:1.55}
.note.warn{background:#fdf6e8;border-left-color:var(--warn);color:#6b4a00}
.note.bad{background:#fdf0f0;border-left-color:var(--bad);color:#7d2020}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--grid);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.kpi.ok:before{background:var(--ok)}.kpi.bad:before{background:var(--bad)}.kpi.gold:before{background:var(--accent)}
.kpi-l{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.kpi-v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.01em}
.kpi-s{font-size:11.5px;color:var(--muted);margin-top:5px}

/* ---------- MODAL ---------- */
.ov{position:fixed;inset:0;background:rgba(8,16,26,.55);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.ov-box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;
  box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.ov-h{padding:16px 20px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  font-family:var(--serif);font-size:15px;font-weight:600}
.ov-h.bad{background:linear-gradient(135deg,#a32828,var(--bad))}
.ov-b{padding:20px;overflow-y:auto}
.ov-b p{margin:0 0 12px;font-size:13.5px;line-height:1.6}
.ov-who{font-size:12.5px;color:var(--muted);padding-bottom:11px;margin-bottom:13px;border-bottom:1px solid var(--grid)}
.ov-f{padding:14px 20px;border-top:1px solid var(--grid);display:flex;gap:10px;justify-content:flex-end;
  flex-wrap:wrap;background:var(--surface-2)}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:200;
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;
  box-shadow:0 10px 34px rgba(0,0,0,.35);opacity:0;transition:transform .28s,opacity .28s;pointer-events:none;max-width:88vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------- SENK ---------- */
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 11px;border-radius:20px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(12,163,12,.8)}
.sync.off .dot{background:var(--warn);box-shadow:0 0 6px rgba(232,147,12,.8)}
.sync.err .dot{background:var(--bad);box-shadow:0 0 6px rgba(208,59,59,.8)}

@media(max-width:820px){
  .topbar-in{height:auto;padding:10px 0;flex-wrap:wrap;gap:10px}
  .tb-title{font-size:14px}.tb-sub{display:none}
  main{padding:16px 12px 50px}
  .steps{flex-direction:column}
  .step{border-right:0;border-bottom:1px solid var(--grid)}
  .f select,.f input{min-width:130px}
}
@media print{body{background:#fff}.topbar,.tabs,.no-print{display:none !important}}
</style>
</head>
<body>

<!-- ================= GİRİŞ ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-top">
      <img src="logo.png" alt="İnciroğlu Otomotiv" onerror="this.style.display='none'">
      <h1>Servis Danışmanı Performans Sistemi</h1>
      <p>HEDEF TEBLİĞ · AYLIK KARNE · GERİ BİLDİRİM</p>
    </div>
    <div class="login-body">
      <form id="loginForm" autocomplete="off">
        <div class="fld">
          <label for="u">Kullanıcı Adı</label>
          <input id="u" type="text" autocomplete="username" required>
        </div>
        <div class="fld">
          <label for="p">Şifre</label>
          <input id="p" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit">Giriş Yap</button>
        <div class="login-err" id="loginErr"></div>
      </form>
      <div class="login-foot">
        İNCİROĞLU OTOMOTİV SAN. TİC. A.Ş.<br>
        İnsan Kaynakları Direktörlüğü · Servis Performans Yönetimi
      </div>
    </div>
  </div>
</div>

<!-- ================= UYGULAMA ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-in">
      <img src="logo.png" alt="" onerror="this.style.display='none'">
      <div>
        <div class="tb-title">Servis Danışmanı Performans Panosu</div>
      </div>
      <div class="tb-spacer"></div>
      <div class="sync" id="syncBox" title="Veri eşitleme durumu"><span class="dot"></span><span id="syncTxt">Bağlanıyor…</span></div>
      <div class="tb-who">
        <b id="whoAd">—</b>
        <span id="whoRol">—</span>
      </div>
      <button class="tb-btn" id="pwBtn" title="Şifre değiştir">🔑</button>
      <button class="tb-btn" id="logoutBtn">Çıkış</button>
    </div>
  </div>
  <div class="tabs"><div class="tabs-in" id="tabs"></div></div>
  <main><div class="wrap"><div class="view" id="view"></div></div></main>
</div>

<div id="ovRoot"></div>
<div id="toast"></div>

<script>
/* ============================================================================
   İNCİROĞLU OTOMOTİV — SERVİS DANIŞMANI PERFORMANS SİSTEMİ
   Tek dosya · build adımı yok · Firebase Firestore ile canlı senkron

   AKIŞ (3 adım):
     1) HEDEF TEBLİĞ  — ayın ilk haftası müdür hedefleri girer, çıktı alınır,
                        imzalatılır, İK'ya gönderilir.
     2) KARNE         — ay bittikten sonra tebliğ edilmiş hedefler karşısına
                        gerçekleşenler yazılır, başarı oranı ve durum çıkar.
     3) GERİ BİLDİRİM — karnede en az 1 metrik "Yetersiz" ise performans geri
                        bildirim formu üretilir, imzalatılır, görüş beyanı alınır.

   VERİ: Sabitler aşağıda TANIM_* olarak durur; admin panelinden yapılan
   değişiklikler Firestore'daki servisVeri/current dokümanına yazılır ve
   uygulama açılışında bu sabitlerin üzerine biner (bkz. veriUygula).
   ========================================================================== */

var AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

/* ---------------------------------------------------------------------------
   MARKALAR ve ROLLER
   Her marka, birden çok "karne rolü" barındırabilir. BMW'de üç ayrı rol
   (mekanik / garanti / hasar) tek müdüre — İbrahim Özdemir'e — bağlıdır.
--------------------------------------------------------------------------- */
var TANIM_MARKALAR=[
  {kod:'BMW',            ad:'BMW',              mudur:'İbrahim Özdemir',    aktif:true,
   roller:['mekanik','garanti','hasar']},
  {kod:'FIAT',           ad:'Fiat',             mudur:'Fatih Boru',         aktif:true,
   roller:['mekanik']},
  {kod:'HONDA',          ad:'Honda',            mudur:'Memet Orhan Çavdar', aktif:true,
   roller:['mekanik','hasar']},
  {kod:'PSA',            ad:'PSA',              mudur:'Birol Caner',        aktif:true,
   roller:['mekanik']},
  {kod:'OMODA_JAECOO',   ad:'Omoda & Jaecoo',   mudur:'',                   aktif:true,
   roller:['mekanik']},
  {kod:'HASAR',          ad:'Hasar (Kaporta-Boya)', mudur:'İbrahim Topçu',  aktif:false,
   roller:['hasar']}
];

var ROL_AD={mekanik:'Mekanik Servis Danışmanı',garanti:'Garanti Servis Danışmanı',hasar:'Hasar Servis Danışmanı'};

/* ---------------------------------------------------------------------------
   METRİK SETLERİ  —  anahtar: "MARKA::rol"
   Alanlar:
     key   : benzersiz kod (aynı set içinde tekrar etmez)
     ad    : karnede/tebliğde görünen ad
     grup  : 'A' = Verimlilik ve Ciro, 'B' = Müşteri Deneyimi ve Kalite
     tip   : 'sayi'  → adet/tutar        (oran = gerçekleşen ÷ hedef)
             'oran'  → yüzde/puan        (oran = gerçekleşen ÷ hedef, % gösterilir)
             'varyok'→ VAR / YOK         (YOK = Başarılı, VAR = Yetersiz)
     yon   : 'yuksek' → büyük olan iyi (varsayılan)
             'dusuk'  → küçük olan iyi (oran = hedef ÷ gerçekleşen)
     esik  : başarı eşiği. 1 = %100. Excel'de oran yazılmayan metrikler için
             İK talimatı gereği varsayılan 1 (minimum %100) kabul edilmiştir.
     vh    : varsayılan hedef (tebliğ ekranında hazır gelir, müdür değiştirebilir)
     not   : metrik altında görünen açıklama
--------------------------------------------------------------------------- */
function M(key,ad,grup,opt){
  opt=opt||{};
  return {key:key,ad:ad,grup:grup||'A',
    tip:opt.tip||'sayi', yon:opt.yon||'yuksek',
    esik:(opt.esik==null?1:opt.esik),
    vh:(opt.vh==null?null:opt.vh),
    not:opt.not||''};
}

var TANIM_METRIKLER={

/* ---------- BMW · MEKANİK ---------- */
'BMW::mekanik':[
  M('is_emri_ucretli','İş Emri Adedi (Ücretli)','A'),
  M('ciro_ucretli_iscilik','Danışman Başına Servis Cirosu (Ücretli İşçilik)','A'),

/* ============================================================================

   ========================================================================== */

/* ---------- küçük yardımcılar ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function elId(i){return document.getElementById(i);}
function trLower(s){return String(s).replace(/İ/g,'i').replace(/I/g,'ı').toLocaleLowerCase('tr');}
function slug(s){return trLower(String(s)).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}
function fmtSayi(n){
  if(n==null||n==='')return '—';
  var x=Number(n); if(!isFinite(x))return '—';
  return x.toLocaleString('tr-TR',{maximumFractionDigits:2});
}
function fmtYuzde(o){
  if(o==null||!isFinite(o))return '—';
  return (o*100).toLocaleString('tr-TR',{maximumFractionDigits:1})+'%';
}
function bugunTR(){
  var d=new Date();
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
}
function isoTarihTR(iso){
  if(!iso)return '—';
  var d=new Date(iso); if(isNaN(d))return '—';
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
}
function toNum(v){
  if(v==null)return null;
  var s=String(v).trim(); if(s==='')return null;
  s=s.replace(/\s/g,'').replace(/\./g,'').replace(',','.');   /* 1.234,56 → 1234.56 */
  var n=Number(s);
  return isFinite(n)?n:null;
}
function toast(msg,ms){
  var t=elId('toast'); if(!t)return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._tmr); t._tmr=setTimeout(function(){t.classList.remove('on');},ms||2600);
}
function sha256(str){

    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  var bytes=[],i;
  for(i=0;i<str.length;i++)bytes.push(str.charCodeAt(i)&0xff);

  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  for(i=7;i>=0;i--)bytes.push((bitLen/Math.pow(2,i*8))&0xff);

      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8);}).join('');
}
function hashPw(user,pw){
  return sha256(unescape(encodeURIComponent(trLower(user)+'::'+pw)));
}

function markaMudur(kod){var m=markaBul(kod);return m?(m.mudur||''):'';}
function aktifMarkalar(){return (WORK.markalar||[]).filter(function(m){return m.aktif!==false;});}
function setKey(marka,rol){return marka+'::'+rol;}
function metrikSeti(marka,rol){return (WORK.metrikler||{})[setKey(marka,rol)]||[];}
function rolAd(rol){return ROL_AD[rol]||rol;}

/* Bir markanın, o markada gerçekten kadrosu olan rolleri. */
function markaRolleri(marka){
  var m=markaBul(marka); if(!m)return [];
  return (m.roller||[]).filter(function(r){return (WORK.metrikler||{})[setKey(marka,r)];});
}
function kadroListe(marka,rol,hepsi){
  return (WORK.kadro||[]).filter(function(k){
    if(marka&&k.marka!==marka)return false;
    if(rol&&k.rol!==rol)return false;

    return true;
  });
}

/* ---------- HESAPLAMA ---------- */
/* Metrik tipine ve yönüne göre başarı oranı.
   'dusuk' yönlü metriklerde (Redflag, Bekleyen İş Emri, Garanti İade …)
   küçük gerçekleşme iyidir; oran = hedef ÷ gerçekleşen. */
function oranHesap(m,hedef,gerc){
  if(!m||m.tip==='varyok')return null;
  var h=toNum(hedef), g=toNum(gerc);
  if(h==null||g==null)return null;
  if(m.yon==='dusuk'){
    if(g<=0)return 2;               /* hiç olumsuzluk yok → tam başarı (üst sınır) */
    if(h<=0)return 0;
    return Math.min(h/g,2);
  }
  if(h<=0)return null;
  return g/h;
}
function durumOner(m,r){
  if(!m)return '';
  if(m.tip==='varyok'){
    var v=(r.gerceklesen==null?'':String(r.gerceklesen)).toUpperCase();
    if(v!=='VAR'&&v!=='YOK')return '';
    return v==='YOK'?'Başarılı':'Yetersiz';
  }
  var o=oranHesap(m,r.hedef,r.gerceklesen);
  if(o==null)return '';
  var esik=(m.esik==null?1:m.esik);
  return (o>=esik-1e-9)?'Başarılı':'Yetersiz';
}
function durumRozet(d){
  if(d==='Başarılı')return '<span class="badge b-ok">Başarılı</span>';
  if(d==='Yetersiz')return '<span class="badge b-bad">Yetersiz</span>';
  if(d==='Etkisi Yok')return '<span class="badge b-mut">Etkisi Yok</span>';
  return '<span class="badge b-mut">—</span>';
}
function oranRozet(m,r){
  if(m.tip==='varyok'){
    var v=(r.gerceklesen==null?'':String(r.gerceklesen)).toUpperCase();
    if(v==='YOK')return '<span class="badge b-ok">YOK</span>';
    if(v==='VAR')return '<span class="badge b-bad">VAR</span>';
    return '<span class="badge b-mut">—</span>';
  }
  var o=oranHesap(m,r.hedef,r.gerceklesen);
  if(o==null)return '<span class="badge b-mut">—</span>';
  var esik=(m.esik==null?1:m.esik);
  var cls=(o>=esik-1e-9)?'b-ok':(o>=esik*0.85?'b-warn':'b-bad');
  return '<span class="badge '+cls+'">'+fmtYuzde(o)+'</span>';
}
/* Karnenin özeti: kaç metrik değerlendirildi, kaçı yetersiz. */
function karneOzet(k){
  var ms=metrikSeti(k.marka,k.rol), toplam=0, basarili=0, yetersiz=0;
  (k.metrikler||[]).forEach(function(r){
    if(r.durum==='Etkisi Yok')return;
    var m=ms.find(function(x){return x.key===r.key;}); if(!m)return;
    if(r.durum==='Başarılı'){toplam++;basarili++;}
    else if(r.durum==='Yetersiz'){toplam++;yetersiz++;}
  });
  return {toplam:toplam,basarili:basarili,yetersiz:yetersiz,
    oran:toplam?basarili/toplam:null};
}

/* ============================================================================
   1. ADIM — HEDEF TEBLİĞ

function tebligYeni(yil,ay,marka,rol,dan){
  var kisi=kadroBul(dan,marka)||{};
  return {
    id:kayitId(yil,ay,marka,rol,dan),
    yil:yil, ay:ay, marka:marka, rol:rol, danisman:dan,
    unvan:kisi.unvan||'', yoneticiAd:markaMudur(marka),
    metrikler:metrikSeti(marka,rol).map(function(m){
      return {key:m.key, hedef:(m.vh==null?null:m.vh)};
    }),
    guncelleme:null, ciktiTarihi:null, ikGonderildi:false,
    tebligEdildi:false, redMi:false, redNot:''
  };
}

function viewTeblig(){
  var S=SEC, h=adimSeridi(1)+secimCubugu('T',S);
  if(!S.danisman){
    h+='<div class="card"><div class="empty"><b>Danışman seçiniz</b>'+
       'Yukarıdan bir servis danışmanı seçtiğinizde o kişinin '+esc(AYLAR[S.ay-1])+' '+S.yil+
       ' dönemi hedef tebliğ formu açılacaktır.</div></div>';
    return h+tebligDonemListesi();
  }
  var kisi=kadroBul(S.danisman,S.marka);
  if(!kisi)return h+'<div class="card"><div class="empty"><b>Kayıt bulunamadı</b>Seçilen danışman kadroda yok.</div></div>';
  S.rol=kisi.rol;

  var t=tebligBul(S.yil,S.ay,S.marka,S.rol,S.danisman)||tebligYeni(S.yil,S.ay,S.marka,S.rol,S.danisman);
  var ms=metrikSeti(S.marka,S.rol);
  var hedefMap={}; (t.metrikler||[]).forEach(function(r){hedefMap[r.key]=r.hedef;});

  /* Durum rozetleri */
  var rz='';
  if(t.tebligEdildi)      rz+='<span class="badge b-ok">✓ Tebliğ Edildi</span> ';

/* Seçili dönemde ekibin tebliğ durumu — müdür kendi markasını, İK hepsini görür. */
function tebligDonemListesi(){
  var S=SEC, markalar=(SES.rol==='admin')?[S.marka]:[SES.marka];
  var satir='';
  markalar.forEach(function(mk){
    kadroListe(mk,'',false).forEach(function(k){
      var t=tebligBul(S.yil,S.ay,mk,k.rol,k.ad);
      var durum,cls;
      if(!t||!t.guncelleme){durum='Girilmedi';cls='b-mut';}
      else if(t.tebligEdildi){durum='Tebliğ Edildi';cls='b-ok';}
      else if(t.redMi){durum='Tebliğ Alınmadı';cls='b-bad';}
      else if(t.ikGonderildi){durum='İK\'da';cls='b-info';}
      else if(t.ciktiTarihi){durum='Çıktı Alındı';cls='b-gold';}
      else {durum='Taslak';cls='b-warn';}
      var dolu=t?(t.metrikler||[]).filter(function(r){return r.hedef!=null&&r.hedef!=='';}).length:0;
      var top=metrikSeti(mk,k.rol).length;
      satir+='<tr><td><b>'+esc(k.ad)+'</b></td><td>'+esc(k.unvan)+'</td>'+
        '<td>'+esc(rolAd(k.rol))+'</td>'+
        '<td class="num">'+dolu+' / '+top+'</td>'+
        '<td><span class="badge '+cls+'">'+durum+'</span></td>'+
        '<td><button class="btn-sm" data-git-t="'+esc(k.ad)+'">Aç</button></td></tr>';
    });
  });
  if(!satir)return '';
  return '<div class="card"><div class="card-h"><h3>Dönem Durumu</h3>'+
    '<span class="sub">'+esc(AYLAR[SEC.ay-1])+' '+SEC.yil+' · '+esc(markaAd(SEC.marka))+'</span></div>'+
    '<div class="card-b tight"><div class="tbl-wrap"><table class="tbl">'+
    '<thead><tr><th>Danışman</th><th>Unvan</th><th>Karne Tipi</th><th class="num">Girilen Hedef</th><th>Durum</th><th></th></tr></thead>'+
    '<tbody>'+satir+'</tbody></table></div></div></div>';
}

/* Formdaki hedefleri okuyup kaydeder. */
function tebligKaydet(sessiz){
  var S=SEC;
  var t=tebligBul(S.yil,S.ay,S.marka,S.rol,S.danisman)||tebligYeni(S.yil,S.ay,S.marka,S.rol,S.danisman);
  var ms=metrikSeti(S.marka,S.rol), yeni=[];
  ms.forEach(function(m){
    var inp=document.querySelector('.t-h[data-k="'+m.key+'"]');
    var v=inp?inp.value:'';
    if(m.tip==='varyok')yeni.push({key:m.key,hedef:v||null});
    else yeni.push({key:m.key,hedef:(v===''?null:toNum(v))});
  });
  t.metrikler=yeni;
  t.unvan=(kadroBul(S.danisman,S.marka)||{}).unvan||t.unvan;
  t.yoneticiAd=markaMudur(S.marka);
  t.guncelleme=new Date().toISOString();
  tebligYaz(t);
  if(!sessiz)toast('✓ Hedefler kaydedildi.');
  return t;
}

/* ============================================================================
   2. ADIM — AYLIK KARNE
   Hedefler, aynı döneme ait Hedef Tebliğ formundan otomatik gelir; müdür yalnız
   gerçekleşen değerleri girer. Başarı oranı ve durum canlı hesaplanır.

/* Şube/takım ortalaması: aynı dönem + marka + roldeki diğer karnelerde o
   metriğe girilmiş gerçekleşen değerlerin ortalaması. */
function subeOrtalama(yil,ay,marka,rol,key,haricDan){
  var top=0,adet=0;
  KARNELER.forEach(function(k){
    if(k.yil!==yil||k.ay!==ay||k.marka!==marka||k.rol!==rol)return;
    if(haricDan&&k.danisman===haricDan)return;
    (k.metrikler||[]).forEach(function(r){
      if(r.key!==key)return;
      var v=toNum(r.gerceklesen);
      if(v!=null){top+=v;adet++;}
    });
  });
  return adet?top/adet:null;
}

function karneYeni(yil,ay,marka,rol,dan){
  var kisi=kadroBul(dan,marka)||{};
  var t=tebligBul(yil,ay,marka,rol,dan);
  var hedefMap={};
  if(t)(t.metrikler||[]).forEach(function(r){hedefMap[r.key]=r.hedef;});
  return {
    id:kayitId(yil,ay,marka,rol,dan),
    yil:yil, ay:ay, marka:marka, rol:rol, danisman:dan,
    unvan:kisi.unvan||'', yoneticiAd:markaMudur(marka),
    metrikler:metrikSeti(marka,rol).map(function(m){
      return {key:m.key, hedef:(hedefMap[m.key]!=null?hedefMap[m.key]:(m.vh==null?null:m.vh)),
              gerceklesen:null, subeOrt:null, durum:''};
    }),
    gelisimPlani:'', durum:'taslak', guncelleme:null,
    kesinlesmeTarihi:null, ciktiTarihi:null, ikGonderildi:false, gbTarihi:null
  };
}

/* Formdaki alanları okuyup karneyi kaydeder. otoDurum=true ise boş bırakılmış
   durum hücrelerini hesaplanan değerle doldurur. */
function karneOku(otoDurum){
  var S=SECK;
  var k=karneBul(S.yil,S.ay,S.marka,S.rol,S.danisman)||karneYeni(S.yil,S.ay,S.marka,S.rol,S.danisman);
  var ms=metrikSeti(S.marka,S.rol), yeni=[];
  ms.forEach(function(m){
    var hd=document.querySelector('.k-hd[data-k="'+m.key+'"]');
    var gr=document.querySelector('.k-gr[data-k="'+m.key+'"]');
    var dr=document.querySelector('.k-dr[data-k="'+m.key+'"]');
    var r={key:m.key,
      hedef:(m.tip==='varyok')?'VAR / YOK':(hd&&hd.value!==''?toNum(hd.value):null),
      gerceklesen:(m.tip==='varyok')?(gr?gr.value||null:null):(gr&&gr.value!==''?toNum(gr.value):null),
      subeOrt:null, durum:(dr?dr.value:'')};
    r.subeOrt=subeOrtalama(S.yil,S.ay,S.marka,S.rol,m.key,S.danisman);
    if(r.subeOrt!=null)r.subeOrt=Math.round(r.subeOrt*100)/100;
    if(otoDurum||!r.durum){
      var oneri=durumOner(m,r);
      if(oneri)r.durum=oneri;
    }
    yeni.push(r);
  });
  k.metrikler=yeni;
  var pl=elId('kPlan'); if(pl)k.gelisimPlani=pl.value;
  k.unvan=(kadroBul(S.danisman,S.marka)||{}).unvan||k.unvan;
  k.yoneticiAd=markaMudur(S.marka);
  k.guncelleme=new Date().toISOString();
  return k;
}

  var ay=FLT.ay||(new Date().getMonth()===0?12:new Date().getMonth());
  var markalar=aktifMarkalar();

  var tTop=0,tEdilen=0,kTop=0,kKesin=0,yetersizKisi=0,danToplam=0;
  var satir=markalar.map(function(mk){
    var kadro=kadroListe(mk.kod,'',false);
    danToplam+=kadro.length;
    var tv=0,te=0,kv=0,kk=0,yz=0;
    kadro.forEach(function(p){
      var t=tebligBul(yil,ay,mk.kod,p.rol,p.ad);
      if(t&&t.guncelleme){tv++; if(t.tebligEdildi)te++;}
      var k=karneBul(yil,ay,mk.kod,p.rol,p.ad);
      if(k&&k.guncelleme){kv++; if(k.durum==='kesinlesen')kk++;
        if(karneOzet(k).yetersiz>0)yz++;}
    });
    tTop+=tv;tEdilen+=te;kTop+=kv;kKesin+=kk;yetersizKisi+=yz;
    function bar(v,t){
      var p=t?Math.round(v/t*100):0;
      return '<div style="display:flex;align-items:center;gap:8px">'+
        '<div style="flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;min-width:60px">'+
        '<div style="height:100%;width:'+p+'%;background:'+(p>=100?'var(--ok)':p>0?'var(--accent)':'transparent')+'"></div></div>'+
        '<span style="font-size:11.5px;color:var(--muted);white-space:nowrap">'+v+'/'+t+'</span></div>';
    }
    return '<tr><td><b>'+esc(mk.ad)+'</b><span class="mtr-not">'+esc(mk.mudur||'— müdür atanmadı —')+'</span></td>'+
      '<td class="num">'+kadro.length+'</td>'+
      '<td style="min-width:130px">'+bar(tv,kadro.length)+'</td>'+
      '<td style="min-width:130px">'+bar(te,kadro.length)+'</td>'+
      '<td style="min-width:130px">'+bar(kv,kadro.length)+'</td>'+
      '<td style="min-width:130px">'+bar(kk,kadro.length)+'</td>'+
      '<td class="num">'+(yz?'<span class="badge b-bad">'+yz+'</span>':'—')+'</td></tr>';
  }).join('');

  var yillar=[];for(var y=new Date().getFullYear()+1;y>=2025;y--)yillar.push(y);

  return '<div class="card"><div class="card-b"><div class="row">'+
    '<div class="f"><label>Yıl</label><select id="gYil">'+
      yillar.map(function(v){return '<option value="'+v+'"'+(yil===v?' selected':'')+'>'+v+'</option>';}).join('')+
    '</select></div>'+
    '<div class="f"><label>Ay</label><select id="gAy">'+
      AYLAR.map(function(a,i){return '<option value="'+(i+1)+'"'+(ay===i+1?' selected':'')+'>'+a+'</option>';}).join('')+
    '</select></div>'+
    '<div style="flex:1"></div>'+
    '<div class="f"><label>&nbsp;</label><button class="btn" id="gYedek">💾 Tüm Veriyi Yedekle (JSON)</button></div>'+
    '</div></div></div>'+

    '<div class="kpis">'+
      '<div class="kpi"><div class="kpi-l">Kapsamdaki Danışman</div><div class="kpi-v">'+danToplam+'</div>'+
        '<div class="kpi-s">'+markalar.length+' marka</div></div>'+
      '<div class="kpi gold"><div class="kpi-l">Hedef Tebliğ Girildi</div><div class="kpi-v">'+tTop+'</div>'+
        '<div class="kpi-s">'+tEdilen+' tanesi tebliğ edildi</div></div>'+
      '<div class="kpi ok"><div class="kpi-l">Karne Girildi</div><div class="kpi-v">'+kTop+'</div>'+
        '<div class="kpi-s">'+kKesin+' tanesi kesinleşti</div></div>'+
      '<div class="kpi'+(yetersizKisi?' bad':'')+'"><div class="kpi-l">Geri Bildirim Gereken</div>'+
        '<div class="kpi-v">'+yetersizKisi+'</div><div class="kpi-s">çalışan</div></div>'+
    '</div>'+

    '<div class="card"><div class="card-h"><h3>Marka Bazında Süreç Takibi</h3>'+
      '<span class="sub">'+esc(AYLAR[ay-1])+' '+yil+'</span></div>'+
    '<div class="card-b tight"><div class="tbl-wrap"><table class="tbl">'+
      '<thead><tr><th>Marka / Servis Müdürü</th><th class="num">Danışman</th>'+
      '<th>Hedef Girildi</th><th>Tebliğ Edildi</th><th>Karne Girildi</th><th>Kesinleşti</th>'+
      '<th class="num">Yetersiz</th></tr></thead><tbody>'+satir+'</tbody></table></div></div></div>';
}

function metrikOku(){
  var yeni=[], ms=metrikSeti(MSEC.marka,MSEC.rol);
  Array.prototype.forEach.call(document.querySelectorAll('tr[data-mi]'),function(tr){
    var i=Number(tr.dataset.mi), eski=ms[i]||{};
    var ad=tr.querySelector('.m-ad').value.trim();
    if(!ad)return;
    var esik=toNum(tr.querySelector('.m-esik').value);
    var vh=tr.querySelector('.m-vh').value.trim();
    yeni.push({
      key:eski.key||('m_'+slug(ad)+'_'+Math.random().toString(36).slice(2,6)),
      ad:ad,
      grup:tr.querySelector('.m-grup').value,
      tip:tr.querySelector('.m-tip').value,
      yon:tr.querySelector('.m-yon').value,
      esik:(esik==null?1:esik/100),
      vh:(vh===''?null:toNum(vh)),
      not:tr.querySelector('.m-not').value.trim()
    });
  });
  return yeni;
}

/* ============================================================================
   OLAY BAĞLAMA — her render sonrası çağrılır
   ========================================================================== */
function bagla(id,olay,fn){var e=elId(id); if(e)e[olay]=fn;}
function baglaHepsi(sec,olay,fn){
  Array.prototype.forEach.call(document.querySelectorAll(sec),function(e){e[olay]=function(ev){fn(e,ev);};});
}

/* Karnede bir satırın başarı oranını ve önerilen durumunu canlı günceller. */
function karneSatirYenile(key){
  var m=metrikSeti(SECK.marka,SECK.rol).find(function(x){return x.key===key;});
  if(!m)return;
  var hd=document.querySelector('.k-hd[data-k="'+key+'"]');
  var gr=document.querySelector('.k-gr[data-k="'+key+'"]');
  var dr=document.querySelector('.k-dr[data-k="'+key+'"]');
  var r={key:key,
    hedef:(m.tip==='varyok')?null:(hd?toNum(hd.value):null),
    gerceklesen:(m.tip==='varyok')?(gr?gr.value:null):(gr?toNum(gr.value):null)};
  var tr=document.querySelector('tr[data-row="'+key+'"]');
  if(tr){var c=tr.querySelector('[data-cell="oran"]'); if(c)c.innerHTML=oranRozet(m,r);}
  var oneri=durumOner(m,r);
  if(dr&&oneri&&dr.value!=='Etkisi Yok')dr.value=oneri;
}

function baglaOlaylar(){
  /* ---------- 1. HEDEF TEBLİĞ ---------- */
  bagla('TYil','onchange',function(e){SEC.yil=Number(e.target.value);render();});
  bagla('TAy','onchange',function(e){SEC.ay=Number(e.target.value);render();});
  bagla('TMarka','onchange',function(e){SEC.marka=e.target.value;SEC.danisman='';render();});
  bagla('TDan','onchange',function(e){SEC.danisman=e.target.value;render();});

  bagla('tKaydet','onclick',function(){tebligKaydet();render();});
  bagla('tYazdir','onclick',function(){
    var t=tebligKaydet(true);
    if(!t.ciktiTarihi){t.ciktiTarihi=new Date().toISOString();tebligYaz(t);}
    yazdirAc(tebligCiktiHtml(t)); render();
  });
  bagla('tIK','onclick',function(){
    var t=tebligKaydet(true);
    t.ikGonderildi=true; if(!t.ciktiTarihi)t.ciktiTarihi=new Date().toISOString();

  });

    var t=tebligBul(SEC.yil,SEC.ay,SEC.marka,SEC.rol,SEC.danisman); if(!t)return;
    t.tebligEdildi=true; t.redMi=false; t.tebligTarihi=new Date().toISOString();

  bagla('kOtoDurum','onclick',function(){

  });

  });

      [{ad:'Vazgeç',cls:'btn',fn:modalKapat},
       {ad:'Kesinleştir',cls:'btn gold',fn:function(){
         k.durum='kesinlesen'; k.kesinlesmeTarihi=new Date().toISOString();
         karneYaz(k); modalKapat(); render();
         if(oz.yetersiz>0)gbModal(k); else toast('✓ Karne kesinleştirildi.');
       }}]);
  });
  baglaHepsi('[data-git-k]','onclick',function(e){
    SECK.danisman=e.dataset.gitK; render(); window.scrollTo({top:0,behavior:'smooth'});
  });

  /* ---------- 3. GERİ BİLDİRİM ---------- */
  baglaHepsi('[data-gb]','onclick',function(e){
    var k=KARNELER.find(function(x){return x.id===e.dataset.gb;});
    if(k)yazdirAc(geriBildirimHtml(k));
  });
  baglaHepsi('[data-gbok]','onclick',function(e){
    var k=KARNELER.find(function(x){return x.id===e.dataset.gbok;}); if(!k)return;
    k.gbTarihi=new Date().toISOString(); karneYaz(k);
    toast('✓ Geri bildirim formunun imzalandığı kaydedildi.'); render();
  });

  /* ---------- GENEL BAKIŞ ---------- */
  bagla('gYil','onchange',function(e){FLT.yil=Number(e.target.value);render();});
  bagla('gAy','onchange',function(e){FLT.ay=Number(e.target.value);render();});
  bagla('gYedek','onclick',function(){
    var veri={tarih:new Date().toISOString(),markalar:WORK.markalar,metrikler:WORK.metrikler,
      kadro:WORK.kadro,tebligler:TEBLIGLER,karneler:KARNELER};
    var b=new Blob([JSON.stringify(veri,null,1)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='servis_panosu_yedek_'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); toast('✓ Yedek indirildi.');
  });

  /* ---------- METRİK YÖNETİMİ ---------- */
  bagla('mMarka','onchange',function(e){MSEC.marka=e.target.value;MSEC.rol='';render();});
  bagla('mRol','onchange',function(e){MSEC.rol=e.target.value;render();});
  bagla('mKaydet','onclick',function(){
    WORK.metrikler[setKey(MSEC.marka,MSEC.rol)]=metrikOku();
    veriKaydet(); toast('✓ Metrik seti kaydedildi.'); render();
  });
  bagla('mEkle','onclick',function(){
    var list=metrikOku();
    list.push({key:'m_yeni_'+Math.random().toString(36).slice(2,7),ad:'Yeni Metrik',
      grup:'A',tip:'sayi',yon:'yuksek',esik:1,vh:null,not:''});
    WORK.metrikler[setKey(MSEC.marka,MSEC.rol)]=list; veriKaydet(true); render();
  });
  baglaHepsi('[data-msil]','onclick',function(e){
    var i=Number(e.dataset.msil), list=metrikOku();
    modalAc('Metriği Sil','<p><b>'+esc(list[i]?list[i].ad:'')+'</b> metriği bu karne tipinden kaldırılacak. '+
      'Daha önce kaydedilmiş karneler etkilenmez.</p>',
      [{ad:'Vazgeç',cls:'btn',fn:modalKapat},
       {ad:'Sil',cls:'btn danger',fn:function(){
         list.splice(i,1); WORK.metrikler[setKey(MSEC.marka,MSEC.rol)]=list;
         veriKaydet(); modalKapat(); render();
       }}],true);
  });
  function metrikTasi(i,yon){
    var list=metrikOku(), j=i+yon;
    if(j<0||j>=list.length)return;
    var t=list[i]; list[i]=list[j]; list[j]=t;
    WORK.metrikler[setKey(MSEC.marka,MSEC.rol)]=list; veriKaydet(true); render();
  }
  baglaHepsi('[data-myuk]','onclick',function(e){metrikTasi(Number(e.dataset.myuk),-1);});
  baglaHepsi('[data-masa]','onclick',function(e){metrikTasi(Number(e.dataset.masa),1);});

  /* ---------- KADRO ---------- */
  bagla('kadKaydet','onclick',function(){
    WORK.kadro=kadroOku(); veriKaydet(); toast('✓ Kadro kaydedildi.'); render();
  });
  bagla('kadEkle','onclick',function(){
    var list=kadroOku();
    list.push({ad:'Yeni Çalışan',unvan:'Servis Danışmanı',
      marka:(aktifMarkalar()[0]||{kod:'BMW'}).kod,rol:'mekanik',giris:'',aktif:true});
    WORK.kadro=list; veriKaydet(true); render();
  });
  baglaHepsi('[data-ksil]','onclick',function(e){
    var i=Number(e.dataset.ksil), list=kadroOku();
    modalAc('Kaydı Sil','<p><b>'+esc(list[i]?list[i].ad:'')+'</b> kadrodan silinecek. '+
      'Bu kişiye ait geçmiş tebliğ ve karneler sistemde kalır.</p>'+
      '<div class="note">Çalışan işten ayrılmadıysa silmek yerine <b>"Karne alır"</b> işaretini '+
      'kaldırmanız önerilir.</div>',
      [{ad:'Vazgeç',cls:'btn',fn:modalKapat},
       {ad:'Sil',cls:'btn danger',fn:function(){
         list.splice(i,1); WORK.kadro=list; veriKaydet(); modalKapat(); render();
       }}],true);
  });
  baglaHepsi('[data-usif]','onclick',function(e){
    var i=Number(e.dataset.usif), u=(WORK.users||[])[i]; if(!u)return;
    modalAc('Şifre Belirle — '+u.ad,
      '<p><b>'+esc(u.kullanici)+'</b> kullanıcısı için yeni bir şifre belirleyeceksiniz. '+
      'Yeni şifreyi ilgili yöneticiye kendiniz iletmelisiniz.</p>'+
      '<div class="fld"><label>Yeni Şifre (en az 6 karakter)</label><input id="uPw" type="text"></div>'+
      '<div id="uErr" style="color:var(--bad);font-size:12.5px;min-height:17px"></div>',
      [{ad:'Vazgeç',cls:'btn',fn:modalKapat},
       {ad:'Kaydet',cls:'btn dark',fn:function(){
         var p=elId('uPw').value;
         if(p.length<6){elId('uErr').textContent='Şifre en az 6 karakter olmalı.';return;}
         u.hash=hashPw(u.kullanici,p); veriKaydet(); modalKapat();
         toast('✓ '+u.kullanici+' kullanıcısının şifresi güncellendi.');
       }}]);
  });
}

/* Kesinleştirme sonrası zorunlu geri bildirim uyarısı. */
function gbModal(k){
  var oz=karneOzet(k);
  modalAc('⚠ Zorunlu Bildirim',
    '<div class="ov-who">'+esc(k.danisman)+' · '+esc(markaAd(k.marka))+' · '+
      esc(AYLAR[k.ay-1])+' '+k.yil+'</div>'+
    '<p>Bu çalışanın karnesinde <b>'+oz.yetersiz+' metrik "Yetersiz"</b> olarak kesinleşmiştir. '+
    'Performans geri bildirim süreci başlatılmalıdır:</p>'+
    '<p>1. Aşağıdaki formu yazdırınız.<br>'+
    '2. Çalışana tebliğ edip <b>görüş beyanını</b> alınız.<br>'+
    '3. İmzalı formu İnsan Kaynakları Direktörlüğü\'ne iletiniz.</p>',
    [{ad:'Kapat',cls:'btn',fn:modalKapat},
     {ad:'📄 Geri Bildirim Formunu Aç',cls:'btn gold',fn:function(){
       yazdirAc(geriBildirimHtml(k)); modalKapat();
     }}],true);
}

</script>

<!-- ============================================================================
     FIRESTORE KÖPRÜSÜ
     Satış Panosu ile aynı Firebase projesi kullanılır; veriler tamamen ayrı
     koleksiyonlarda tutulur:
        servisVeri/current   → metrik setleri, kadro, markalar, kullanıcılar
        servisTebligler/{id} → hedef tebliğ formları
        servisKarneler/{id}  → aylık performans karneleri
     İnternet yoksa uygulama yerel modda (localStorage) çalışmaya devam eder.
     ========================================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, setDoc, collection, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWlB0nU-ETZxuo9xa6gG4VMYVu09P3fnE",
    authDomain: "yetenek-havuzu.firebaseapp.com",
    projectId: "yetenek-havuzu",
    storageBucket: "yetenek-havuzu.firebasestorage.app",
    messagingSenderId: "714642441227",
    appId: "1:714642441227:web:bf49ac51367c6d9437b30e"
  };

  try {
    const app = initializeApp(firebaseConfig, "servis-panosu");
    const db  = getFirestore(app);
    const veriRef   = doc(db, "servisVeri", "current");
    const tebligCol = collection(db, "servisTebligler");
    const karneCol  = collection(db, "servisKarneler");

    /* undefined değerler Firestore tarafından reddedilir — temizleyerek yazıyoruz. */
    const temiz = (o) => JSON.parse(JSON.stringify(o));

    window.ServisFB = {
      pushVeri(p){
        return setDoc(veriRef, Object.assign(temiz(p), {updatedAt: serverTimestamp()}), {merge:true});
      },
      pushTeblig(t){
        return setDoc(doc(tebligCol, t.id), Object.assign(temiz(t), {updatedAt: serverTimestamp()}), {merge:true});
      },
      pushKarne(k){
        return setDoc(doc(karneCol, k.id), Object.assign(temiz(k), {updatedAt: serverTimestamp()}), {merge:true});
      }
    };

    const hata = (e) => { if (window.servisBaglantiHatasi) window.servisBaglantiHatasi(e && e.message); };

    onSnapshot(veriRef, (snap) => {
      if (snap.exists() && window.servisVeriGeldi) window.servisVeriGeldi(snap.data());
    }, hata);

    onSnapshot(tebligCol, (snap) => {
      const l = []; snap.forEach(d => l.push(d.data()));
      if (window.servisTebliglerGeldi) window.servisTebliglerGeldi(l);
    }, hata);

    onSnapshot(karneCol, (snap) => {
      const l = []; snap.forEach(d => l.push(d.data()));
      if (window.servisKarnelerGeldi) window.servisKarnelerGeldi(l);
    }, hata);

  } catch (e) {
    if (window.servisBaglantiHatasi) window.servisBaglantiHatasi(e && e.message);
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
